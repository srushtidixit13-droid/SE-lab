<head>

  <title>Sample Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #333;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {

      padding: 10px;

    }

      position: fixed;
      bottom: 0;

</head>

  </header>
  <nav>

  </footer>

</html>
